<!DOCTYPE html>
<html>
	<head>
		<title>scoricomb@home</title>
		<script src="scoricomb.js?v4"></script>
		<script src="index.js?v3" defer></script>
		<script src='https://cdn.plot.ly/plotly-4.0.0.min.js'></script>
		<link rel="icon" type="image/x-icon" href="favicon.ico">
	</head>
	<body>
		<ul>
			<li><span id="prestoredScoreCounter">0</span> scores prestored (<a href="javascript:retrieveData();">fetch</a>, <a href="javascript:updatePrestoredScoreCounter();updateChart();">update</a>)</li>
			<li><progress id="queuedProgress" value=1 max=1></progress><span id="queuedPercent">100%</span></li>
			<li id="currentDisplay"></li>
		</ul>
		<p>
			<input type="range" min=0 max=1 value=1 id="workerMaxSlider" oninput="updateWorkerMax(this.value);" />
			<span id="workerMaxDisplay">1</span> worker(s) allocated
		</p>
		<p>
			<button onclick="startWorking(parseInt(maxScoreSetting.value));">start working</button>
			<input type="number" value=10 id="maxScoreSetting" placeholder="Max score to calculate to" />
		</p>
		<div id="plotDiv" style="width: 500px; height: 500px;"></div>
	</body>
</html>
